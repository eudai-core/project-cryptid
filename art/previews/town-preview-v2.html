<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cryptid Town Hub · preview v2</title>
  <style>:root {
  --void: #100e11;
  --soot: #2a2427;
  --ash: #3a3338;
  --bone: #e8e0cf;
  --bonedim: #a79f90;
  --gold: #9c7a3c;
  --goldb: #c9a55a;
  --blood: #7a0f12;
  --glass: rgba(16, 14, 18, 0.82);
  --line: rgba(156, 122, 60, 0.45);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0c0618; color: var(--bone);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
#c { display: block; width: 100%; height: 100%; }
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
.world-label {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  opacity: 0; transition: opacity 0.15s ease; will-change: transform;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.65));
}
.world-label .label-name {
  background: var(--glass); border: 1px solid var(--line); color: var(--bone);
  font-family: Georgia, "Times New Roman", serif; letter-spacing: 0.08em;
  font-size: 12px; text-transform: uppercase; padding: 5px 10px; border-radius: 4px;
  white-space: nowrap;
}
.world-label .label-e {
  width: 26px; height: 26px; display: grid; place-items: center;
  background: rgba(20,17,20,0.9); border: 1px solid var(--goldb); border-radius: 5px;
  color: var(--goldb); font-weight: 700; font-size: 13px;
}
.world-label.selected .label-name { border-color: var(--goldb); color: var(--goldb); }
.world-label:hover .label-name { border-color: var(--goldb); }

header.top {
  position: fixed; top: 14px; left: 16px; right: 16px; z-index: 6;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  pointer-events: none;
}
.brand {
  pointer-events: none;
  background: var(--glass); border: 1px solid var(--line); border-radius: 4px;
  padding: 10px 16px 9px; backdrop-filter: blur(8px);
}
.brand h1 {
  font-family: Georgia, "Times New Roman", serif; font-weight: 600;
  font-size: 18px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--bone);
}
.brand p { margin-top: 3px; font-size: 11px; color: var(--bonedim); letter-spacing: 0.04em; }

.toggles {
  pointer-events: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px;
  background: var(--glass); border: 1px solid var(--line); border-radius: 4px;
  padding: 8px 10px; backdrop-filter: blur(8px);
}
.toggles label, .toggles .field {
  display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--bonedim);
  letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; user-select: none;
}
.toggles select {
  background: var(--soot); color: var(--bone); border: 1px solid var(--line);
  border-radius: 4px; padding: 3px 6px; font: inherit; color: var(--bone);
}
.toggles input[type="checkbox"] { accent-color: var(--goldb); }

#presets {
  position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
  z-index: 6; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
  max-width: calc(100% - 32px); padding: 8px;
  background: var(--glass); border: 1px solid var(--line); border-radius: 4px;
  backdrop-filter: blur(8px);
}
#presets button, #panel-close, .ghost {
  background: var(--soot); color: var(--bone); border: 1px solid var(--line);
  border-radius: 4px; padding: 6px 11px; font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; cursor: pointer; font-family: inherit;
}
#presets button:hover, #panel-close:hover { border-color: var(--goldb); color: var(--goldb); }
#presets button.active { background: #3a2e20; border-color: var(--goldb); color: var(--goldb); }

#hint {
  position: fixed; left: 16px; bottom: 16px; z-index: 5;
  font-size: 11px; color: var(--bonedim); letter-spacing: 0.03em;
  background: var(--glass); border: 1px solid var(--line); border-radius: 4px;
  padding: 7px 10px; backdrop-filter: blur(8px);
}

#panel {
  position: fixed; top: 96px; right: 16px; width: min(340px, calc(100vw - 32px));
  z-index: 7; background: var(--glass); border: 1px solid var(--line); border-radius: 4px;
  padding: 16px 16px 14px; backdrop-filter: blur(10px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
}
#panel[hidden] { display: none !important; }
#panel header.ph { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
#panel h2 {
  font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 600;
  letter-spacing: 0.06em; color: var(--bone); line-height: 1.25;
}
#panel-close { padding: 4px 8px; flex: none; }
#panel-role { font-size: 13px; line-height: 1.45; color: var(--bone); margin-bottom: 12px; }
#panel .vfx-k {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold);
  margin-bottom: 4px;
}
#panel-vfx { font-size: 12px; line-height: 1.45; color: var(--bonedim); }

@media (max-width: 720px) {
  #hint { display: none; }
  header.top { flex-direction: column; align-items: stretch; }
  .toggles { justify-content: flex-start; }
  #panel { top: auto; bottom: 78px; right: 12px; left: 12px; width: auto; }
}

#panel-rbx { font-size: 12px; line-height: 1.45; color: var(--bonedim); }
#panel .rbx-k {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold);
  margin: 12px 0 4px;
}
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <header class="top">
    <div class="brand">
      <h1>Cryptid Town Hub</h1>
      <p>preview v2 (reference mock, not final)</p>
    </div>
    <div class="toggles">
      <label class="field">Night event
        <select id="event-mode">
          <option value="normal">Normal</option>
          <option value="blood">Blood Moon</option>
          <option value="rift">Rift Storm</option>
        </select>
      </label>
      <label><input type="checkbox" id="toggle-vfx" checked /> VFX</label>
      <label><input type="checkbox" id="toggle-labels" checked /> Labels</label>
      <label><input type="checkbox" id="auto-spin" checked /> Auto-spin</label>
    </div>
  </header>
  <div id="presets">
    <button data-preset="overview" class="active">Overview</button>
    <button data-preset="well">Well</button>
    <button data-preset="tavern">Tavern</button>
    <button data-preset="apothecary">Apothecary</button>
    <button data-preset="tarot">Veil &amp; Fate</button>
    <button data-preset="lanternwright">Lanternwright</button>
    <button data-preset="pedlar">Pedlar</button>
    <button data-preset="portals">Portals</button>
    <button data-preset="clock">Clock Tower</button>
  </div>
  <aside id="panel" hidden>
    <header class="ph">
      <h2 id="panel-title">Title</h2>
      <button type="button" id="panel-close" aria-label="Close">Close</button>
    </header>
    <p id="panel-role"></p>
    <div class="vfx-k">Light / VFX notes</div>
    <p id="panel-vfx"></p>
    <div class="rbx-k">Roblox build notes</div>
    <p id="panel-rbx"></p>
  </aside>
  <div id="hint">Drag to orbit · Scroll to zoom · Click a building</div>
